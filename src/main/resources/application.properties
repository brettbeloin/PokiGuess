spring.application.name=pokiGuess
server.port=8080


# --- MySQL (JPA) ---
# ${DB_HOST:localhost} = use the DB_HOST variable if it's set, otherwise "localhost".
# In Docker, compose sets DB_HOST=mysql. Running with ./mvnw on your PC, it's localhost.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/pokiguess
spring.datasource.username=user
spring.datasource.password=pokiepass
# Hibernate creates and updates tables to match your @Entity classes (and never drops your data)
spring.jpa.hibernate.ddl-auto=update

# --- MongoDB ---
spring.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/pokiguess
