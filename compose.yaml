services:
  api:
    build: .
    container_name: PokiGuess
    environment:
      - TZ=America/Denver
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/PokeGuess?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Denver
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=pokiepass
      - MONGO_HOST=mongo
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
  
  mysql:
    image: mysql:8.4
    container_name: user-mysql
    environment:
      - TZ=America/Denver
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=PokeGuess
      - MYSQL_USER=user
      - MYSQL_PASSWORD=pokiepass
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  mongo:
    image: mongo:8.0
    container_name: pokemon-mongo
    environment:
      - TZ=America/Denver
    ports:
      - "27017:27017"
    volumes:
      - mongo-pokemon-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
  mongo-pokemon-data:
